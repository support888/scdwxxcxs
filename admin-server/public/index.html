<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLS俱乐部 · 后台管理</title>
<link rel="stylesheet" href="/admin.css">
</head>
<body>

<!-- 登录层 -->
<div class="login-mask" id="loginMask">
  <div class="login-card">
    <div class="login-logo">LLS</div>
    <div class="login-title">LLS俱乐部 · 后台管理</div>
    <div class="login-sub">本地演示后台 · 管理员登录</div>
    <input class="login-input" id="loginUser" placeholder="管理员账号" autocomplete="username">
    <input class="login-input" id="loginPass" type="password" placeholder="密码" autocomplete="current-password">
    <button class="login-btn" id="loginBtn">登 录</button>
    <div class="login-tip" id="loginTip"></div>
  </div>
</div>

<div class="layout" id="layout" style="display:none;">
  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="brand"><span class="brand-dot"></span>LLS俱乐部后台</div>
    <nav class="menu" id="menu">
      <a data-view="dashboard" class="active">📊 数据概览</a>
      <a data-view="users">👤 注册用户</a>
      <a data-view="players">🎮 护航员</a>
      <a data-view="feeds">📝 广场动态</a>
      <a data-view="comments">💬 评论管理</a>
      <a data-view="coupons">🎟 优惠券</a>
      <a data-view="income">💰 收入记录</a>
      <a data-view="config">⚙️ 系统设置</a>
    </nav>
    <div class="sidebar-foot">
      <div class="admin-name" id="adminName"></div>
      <button class="btn-ghost" id="logoutBtn">退出登录</button>
    </div>
  </aside>

  <!-- 主区 -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-title" id="viewTitle">数据概览</div>
      <div class="topbar-actions" id="viewActions"></div>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>

<!-- 弹窗 -->
<div class="modal-mask" id="modalMask" style="display:none;">
  <div class="modal">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn-ghost" id="modalCancel">取消</button>
      <button class="btn-primary" id="modalOk">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="/admin.js"></script>
</body>
</html>
